<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Stars Radar</title>
  <meta name="description" content="New, hot and all-time top GitHub repositories: AI dev skills, AI tools, AI agents, mobile, web and 14 languages.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f97316' d='M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1><span class="star">★</span> GitHub Stars Radar</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="controls">
        <div class="locale" role="group" id="locales" data-i18n-aria="localeAria">
          <button data-locale="en">EN</button>
          <button data-locale="vi">VI</button>
        </div>
        <div class="mode" role="tablist" id="modes" data-i18n-aria="modeAria"></div>
        <div class="period" role="tablist" id="periods" data-i18n-aria="periodAria"></div>
      </div>
    </header>

    <nav class="chips" id="categories" data-i18n-aria="categoriesAria"></nav>
    <nav class="chips chips-sub" id="subs" data-i18n-aria="languagesAria" hidden></nav>

    <div class="toolbar">
      <p class="hint" id="hint"></p>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      </label>
    </div>

    <section class="board">
      <div class="row head" aria-hidden="true">
        <span>#</span>
        <span data-i18n="colRepo"></span>
        <span data-i18n="colDesc"></span>
        <span class="right" id="col-stars"></span>
        <span></span>
      </div>
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" hidden></p>
    </section>

    <footer class="foot">
      <span id="updated"></span>
      <span id="source"></span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
