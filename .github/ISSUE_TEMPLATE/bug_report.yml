name: 🐛 Bug report
description: Something on the site or in the data script is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page link
      description: The exact link, including the part after `#`.
      placeholder: https://dab246.github.io/github-stars-radar/#/week/ai-agents
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS / Safari on iPhone 15
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
